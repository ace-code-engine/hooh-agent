name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}   # 允许手动触发

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true   # 连续 push 时自动取消旧任务

jobs:
  test:
    name: Test (${{ matrix.os }} · Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests textual

      - name: Compile check
        run: python -m compileall -q ai_code.py agent_runner.py execution_layer.py setup_env.py test_all.py gateway_v2 tools e2e benchmarks cli core ui demo docker packaging engine skills

      # 失败时把失败项打成 GitHub **注解**：注解不需要登录就能读（REST 的 job log
      # 要 admin 权限），本机复现不了平台差异时，这是唯一能拿到原因的路子。
      - name: Run tests (端到端全量)
        run: |
          set +e
          python test_all.py 2>&1 | tee "$RUNNER_TEMP/test_all.log"
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::error title=ace-tests-failed::test_all.py 退出码 $code（最多列 8 条失败项）"
            grep -E '^  - ' "$RUNNER_TEMP/test_all.log" | head -8 | while IFS= read -r line; do
              echo "::error title=ace-test-failure::${line}"
            done
          fi
          exit "$code"

      # README 首屏那张动画是真实会话录出来的,会随 CLI 输出漂移;
      # --check 在临时工作目录里重放一遍并比对骨架(数字已归一化)。跑一次就够。
      - name: Demo 动画与当前 CLI 输出一致
        if: matrix.python-version == '3.12'
        run: python demo/record_demo.py --check

  # Rust 元处理引擎（engine/）：CI 此前**从不编译它** —— 那句 compileall 只语法检查了
  # `engine/tools/xcheck.py`。于是引擎那 20 条单测、`--selftest`、以及 test_all [70] 里
  # "引擎路径 == 纯 Python 降级路径"那几条断言，在 CI 上**都在拿降级路径和它自己比**
  # （二进制不在 → 两边都是 Python，恒等成立、必过）。那不是覆盖率低，是**承诺没人在验**：
  # 引擎烂掉 CI 也不会响。
  engine:
    name: Rust engine (build + unit tests + parity with the Python fallback)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTFLAGS: -D warnings        # 与仓库对 ruff 零命中的取态一致：警告即红
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 零依赖 crate：`--offline` 顺便证明"真的没有隐藏的 crate 依赖"（评审过的那条边界）
      - name: Build (release, offline)
        working-directory: engine
        run: cargo build --release --offline

      - name: Unit tests
        working-directory: engine
        run: cargo test --release --offline

      - name: Self-test
        working-directory: engine
        run: ./target/release/ace-engine --selftest

      # 先证明"引擎真的被找到"，再跑断言 —— 否则下一步照样会在降级路径上空转，
      # 也就是这个作业要消灭的那个问题本身。
      - name: 断言引擎真的被发现（否则下一步空转）
        run: |
          python -c "import sys; from core import ace_engine as ae; p = ae.engine_path(); print('engine_path() ->', p); sys.exit(0 if ae.engine_available() else 'engine NOT found: 下面的断言会空转')"

      # 带着引擎跑：`--only 70` 会连带把依赖段完整跑一遍（实测 65 段 / 2308 条 / 约 71 s），
      # 于是 E1–E5 与 H1–H4 / I1–I3 那些"两条路径同口径"的断言才真的在比两个实现。
      - name: 带引擎跑断言（引擎路径 ↔ 纯 Python 降级路径必须同口径）
        run: |
          set +e
          python test_all.py --only 70 2>&1 | tee "$RUNNER_TEMP/engine_tests.log"
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::error title=ace-engine-tests-failed::test_all.py --only 70 退出码 $code（最多列 8 条）"
            grep -E '^  - ' "$RUNNER_TEMP/engine_tests.log" | head -8 | while IFS= read -r line; do
              echo "::error title=ace-engine-test-failure::${line}"
            done
          fi
          exit "$code"

      # 真实数据对拍（xcheck）要读用户的 .agent_memory.json / .ace_sessions，仓库里没有；
      # 它是本地工具而不是 CI 门禁，所以有就跑、没有就如实说跳过。
      - name: 真实数据对拍（有真实记忆才跑）
        run: |
          if [ -f .agent_memory.json ]; then
            python engine/tools/xcheck.py
          else
            echo "无 .agent_memory.json（CI 的正常情况），跳过真实数据对拍"
          fi

  # 容器那套加固参数（--init / --ulimit nofile / HOME=/tmp / --read-only / cap-drop ALL …）
  # 是不是真被 daemon 接受、--network none 与 --read-only 边界是不是真成立，
  # 光读代码答不出来 —— 2026-09-19 之前这件事从来没人验过。脚本用的是客户端自己的
  # 参数构造，先本地构建镜像再跑一遍就有结论。
  sandbox-smoke:
    name: Sandbox smoke (build image + run through DockerSandbox)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build the sandbox image locally
        run: docker build -t ace-sandbox:latest -f docker/Dockerfile.sandbox .

      - name: Run through DockerSandbox
        run: python3 docker/smoke_sandbox.py

  go-test:
    name: Go executor (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: executor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: executor/go.mod

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      # -race 需要 cgo；Windows 官方 runner 无 C 编译器，
      # 这里只在 ubuntu 上跑 race 检测（ADR-002 的约定）
      - name: Race test (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./...

  lint:
    name: Ruff lint (安全子集)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      # 硬错误集 + 死导入/未用变量/无比较比较。F401/F841 用 ruff --fix 自动清理，
      # 提交前本地保持零命中；ruff 尊重 .gitignore 自动跳过 .test_tmp
      - run: ruff check . --select E9,F63,F7,F82,F401,F841,E711,F811

  bench:
    name: Benchmark health (--quick)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run bench (样本减半)
        run: |
          python benchmarks/bench_core.py --quick
          echo "--- bench_report.md 摘要 ---"
          cat benchmarks/results/bench_report.md

  e2e-real-model:
    # 真实模型端到端冒烟：未配 ACE_E2E_* secrets 时在 step 内自检跳过（不红）。
    # 注意：secrets 不能用于 job 级 if（GitHub 限制），故走 env 传空串 + shell 自检。
    name: E2E real model (OpenAI 兼容)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Real-model E2E (提问 → 执行层裁决 → 工具 → 作答)
        env:
          ACE_E2E_BASE_URL: ${{ secrets.ACE_E2E_BASE_URL }}
          ACE_E2E_API_KEY: ${{ secrets.ACE_E2E_API_KEY }}
          ACE_E2E_MODEL: ${{ secrets.ACE_E2E_MODEL }}
        run: |
          if [ -z "${ACE_E2E_API_KEY}" ] || [ -z "${ACE_E2E_BASE_URL}" ] || [ -z "${ACE_E2E_MODEL}" ]; then
            echo "未配置 ACE_E2E_BASE_URL / ACE_E2E_API_KEY / ACE_E2E_MODEL → 跳过真实模型 e2e（配好 secrets 后自动启用）"
            exit 0
          fi
          python e2e/real_model_smoke.py

  # 主前端（frontend/，TypeScript + Ink）：**此前从不进 CI**。仓库里有 17 个测试文件、
  # 260 余条用例（`npm test`），其中两条是**跨语言守卫** —— `theme.test.ts` 直接读
  # `ui/ace_theme.py`、`protocol.test.ts` 直接读 `core/ace_events.py` /
  # `agent_runner.py` 做逐条比对。也就是说：Python 侧改个色名、加个事件类型，
  # 那边改名这边没跟，**只有本机跑过 npm test 的人才知道**，CI 一直是绿的。
  # 另有 `integration.test.ts` 起**真引擎**（真管道、真协议、真审批往返）——
  # 那是 `ace --serve` 目前唯一的端到端覆盖。
  # H-31 之后它不再写 checkout（引擎拿到临时 --project-root），所以可以安全地进 CI。
  frontend:
    name: Frontend (tsc + vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # integration.test.ts 会 spawn `python ai_code.py --serve`，而引擎要 requests
      # （`resolvePython()` 依次探 ACE_PYTHON → 已知路径 → `python`，setup-python 提供后者）
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          npm ci
          python -m pip install --upgrade pip
          pip install requests

      - name: Typecheck (tsc --noEmit)
        run: npm run build

      - name: Tests (vitest：单元 + 假引擎界面 + 真引擎集成)
        run: npm test
