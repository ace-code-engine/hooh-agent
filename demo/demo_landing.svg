<text x="503.5" y="21" text-anchor="middle" font-size="12.5" fill="#7d879c">hooh-agent — python ai_code.py --mock</text>
<text class="r0" x="22" y="52" xml:space="preserve"><tspan fill="#d7dce5">HooH 1.1.0</tspan><tspan fill="#d7dce5"> · </tspan><tspan fill="#66cccc">目录 project</tspan><tspan fill="#d7dce5"> · </tspan><tspan fill="#7d879c">mock</tspan><tspan fill="#d7dce5"> · </tspan><tspan fill="#7d879c">readonly</tspan></text>
<text class="r1" x="22" y="76" xml:space="preserve">&#160;</text>
<text class="r2" x="22" y="100" xml:space="preserve"><tspan fill="#d7dce5">  接着上次</tspan></text>
<text class="r3" x="22" y="124" xml:space="preserve"><tspan fill="#d7dce5">  &gt; 继续上次：09-17 23:07 · 1 轮 回车继续 / ↑↓ 选别的</tspan></text>
<text class="r4" x="22" y="148" xml:space="preserve">&#160;</text>
<text class="r5" x="22" y="172" xml:space="preserve"><tspan fill="#d7dce5">  开始</tspan></text>
<text class="r6" x="22" y="196" xml:space="preserve"><tspan fill="#d7dce5">    新对话            清空上下文并开一段新会话（Alt+N）</tspan></text>
<text class="r7" x="22" y="220" xml:space="preserve"><tspan fill="#d7dce5">    历史对话（2 条）  挑一条继续（Alt+H）</tspan></text>
<text class="r8" x="22" y="244" xml:space="preserve"><tspan fill="#d7dce5">    命令与键位        /help 或 F1</tspan></text>
<text class="r9" x="22" y="268" xml:space="preserve">&#160;</text>
<text class="r10" x="22" y="292" xml:space="preserve"><tspan fill="#d7dce5">  能力（这里改，立刻生效）</tspan></text>
<text class="r11" x="22" y="316" xml:space="preserve"><tspan fill="#d7dce5">    思考强度    auto      auto → 低 → 中 → 高 → 最高（Alt+T 循环）</tspan></text>
<text class="r12" x="22" y="340" xml:space="preserve"><tspan fill="#d7dce5">    联网思考    on        回答前先搜网、列来源（Alt+W 切换）</tspan></text>
<text class="r13" x="22" y="364" xml:space="preserve"><tspan fill="#d7dce5">    界面语言    zh        中文 / English / 日本語（Alt+L 切换）</tspan></text>
<text class="r14" x="22" y="388" xml:space="preserve"><tspan fill="#d7dce5">    权限档      readonly  只读 → 可写 → 全权（Shift+Tab）</tspan></text>
<text class="r15" x="22" y="412" xml:space="preserve"><tspan fill="#d7dce5">    模型        mock      换模型 / 换提供商（Alt+M）</tspan></text>
<text class="r16" x="22" y="436" xml:space="preserve">&#160;</text>
<text class="r17" x="22" y="460" xml:space="preserve"><tspan fill="#d7dce5">  我们独有的</tspan></text>
<text class="r18" x="22" y="484" xml:space="preserve"><tspan fill="#d7dce5">    回溯（0 个快照）  退对话 / 回退文件（Esc Esc）</tspan></text>
<text class="r19" x="22" y="508" xml:space="preserve"><tspan fill="#d7dce5">    任务树与改动      /tasks · /diff · /report</tspan></text>
<text class="r20" x="22" y="532" xml:space="preserve"><tspan fill="#d7dce5">    本轮报告          /report 导出这段会话</tspan></text>
<text class="r21" x="22" y="556" xml:space="preserve">&#160;</text>
<text class="r22" x="22" y="580" xml:space="preserve"><tspan fill="#7d879c">↑↓ 选 · 回车执行 · 也可以直接在下面打字（/ 命令 · @ 引用 · ! 命令 · F1 帮助）</tspan></text>
<text class="r23" x="22" y="604" xml:space="preserve">&#160;</text>
<text class="r24" x="22" y="628" xml:space="preserve"><tspan fill="#d7dce5">·· 底部状态栏（真实运行时实时刷新） ····················································</tspan></text>
<text class="r25" x="22" y="652" xml:space="preserve"><tspan fill="#d7dce5">mock  权限:readonly  沙箱:off  联网:开  轮0 工具0  上下文0%</tspan></text>
<text class="r26" x="22" y="676" xml:space="preserve">&#160;</text>
<text class="r27" x="22" y="700" xml:space="preserve"><tspan fill="#7d879c">以上是界面预览（--preview 只画界面、不进对话）。真正运行时：↑/↓ 选择 · 数字直选 · Enter 确认 · Esc/q 退出。</tspan></text>
